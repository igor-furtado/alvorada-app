services:
  mysql:
    image: mysql:8.4
    container_name: estudos_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-estudos}
      MYSQL_USER: ${DB_USER:-estudos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-estudos}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    container_name: estudos_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-estudos}
      DB_USER: ${DB_USER:-estudos}
      DB_PASSWORD: ${DB_PASSWORD:-estudos}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
