<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Catálogo de Disciplinas · Protótipo Prumo</title>
    <!--
      PROTÓTIPO DESCARTÁVEL — não é código de produção.
      Três variantes da tela de Disciplinas, alternadas por ?variant=A|B|C,
      explorando como dar mais impacto ao catálogo sem perder sua função.
    -->
    <style>
      :root {
        --ink:#18181b; --muted:#71717a; --soft:#a1a1aa;
        --line:#e4e4e7; --line-strong:#d4d4d8; --canvas:#f7f7f6;
        --paper:#fff; --wash:#f4f4f5; --blue:#2563eb; --blue-dark:#1e40af;
        --blue-soft:#eff6ff; --navy:#101828; --radius-sm:8px; --radius:12px;
        --radius-lg:18px; --shadow:0 16px 44px rgba(24,24,27,.14),0 2px 8px rgba(24,24,27,.08);
      }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; padding-left:232px; color:var(--ink); background:var(--canvas); font-family:Geist,Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
      button,input,select { font:inherit; }
      button { color:inherit; }
      a { color:inherit; text-decoration:none; }
      svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      :focus-visible { outline:3px solid rgba(37,99,235,.3); outline-offset:2px; }
      h1,h2,h3,p { margin-top:0; }
      h1 { margin-bottom:0; font-size:clamp(38px,5vw,68px); line-height:.98; letter-spacing:-.055em; }
      h2 { margin-bottom:0; font-size:26px; line-height:1.12; letter-spacing:-.035em; }
      h3 { margin-bottom:0; }
      .container { width:min(1240px,calc(100% - 56px)); margin:0 auto; }
      .muted { color:var(--muted); }
      .eyebrow { margin:0 0 10px; color:var(--blue-dark); font-size:11px; font-weight:760; letter-spacing:.1em; text-transform:uppercase; }
      .button { min-height:40px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 15px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:var(--paper); cursor:pointer; font-weight:680; white-space:nowrap; }
      .button:hover { background:var(--wash); }
      .button.primary { border-color:var(--ink); background:var(--ink); color:white; }
      .button.light { border-color:rgba(255,255,255,.18); background:rgba(255,255,255,.08); color:white; }
      .icon-button { width:38px; height:38px; display:grid; place-items:center; padding:0; border:1px solid var(--line); border-radius:9px; background:var(--paper); cursor:pointer; }
      .search { position:relative; display:block; }
      .search svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); }
      .search input { width:100%; height:42px; padding:0 14px 0 40px; border:1px solid var(--line-strong); border-radius:9px; background:var(--paper); }
      .order-select { height:42px; padding:0 34px 0 12px; border:1px solid var(--line-strong); border-radius:9px; background:var(--paper); color:var(--muted); font-weight:620; }

      .sidebar { position:fixed; inset:0 auto 0 0; z-index:80; width:232px; display:flex; flex-direction:column; padding:20px 14px; border-right:1px solid var(--line); background:var(--paper); }
      .brand { min-height:44px; display:flex; align-items:center; gap:11px; padding:0 10px; font-size:18px; font-weight:760; letter-spacing:-.03em; }
      .brand-mark { width:29px; height:29px; display:grid; place-items:center; border-radius:8px; background:var(--ink); color:white; }
      .brand-mark svg { width:17px; height:17px; }
      .sidebar-nav { display:flex; flex-direction:column; gap:4px; margin-top:34px; }
      .sidebar-nav a { min-height:42px; display:flex; align-items:center; gap:12px; padding:0 12px; border-radius:9px; color:var(--muted); font-weight:620; }
      .sidebar-nav a:hover { background:var(--wash); color:var(--ink); }
      .sidebar-nav a.active { background:var(--ink); color:white; }
      .sidebar-account { display:flex; align-items:center; gap:11px; margin-top:auto; padding:14px 10px 0; border-top:1px solid var(--line); }
      .avatar { width:32px; height:32px; display:grid; place-items:center; flex:0 0 auto; border:1px solid var(--line); border-radius:50%; background:var(--wash); font-size:12px; font-weight:720; }
      .sidebar-account strong,.sidebar-account span { display:block; }
      .sidebar-account span { color:var(--muted); font-size:11px; }

      .page-top { padding:20px 0 0; background:var(--paper); border-bottom:1px solid var(--line); }
      .breadcrumbs { display:flex; align-items:center; gap:7px; padding-bottom:17px; color:var(--muted); font-size:12px; }
      .breadcrumbs svg { width:14px; height:14px; }
      .page-tabs { display:flex; gap:24px; }
      .page-tabs span { position:relative; padding:12px 1px; color:var(--muted); font-size:12px; font-weight:680; }
      .page-tabs .active { color:var(--ink); }
      .page-tabs .active::after { content:""; position:absolute; inset:auto 0 -1px; height:2px; background:var(--ink); }

      #variant-host { min-height:calc(100vh - 92px); }
      .variant { padding:36px 0 120px; }
      .result-state { color:var(--muted); font-size:12px; }
      .topic-pill { display:inline-flex; align-items:center; padding:6px 9px; border:1px solid var(--line); border-radius:999px; background:var(--paper); color:var(--muted); font-size:11px; }
      .mandatory { display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:11px; font-weight:650; }
      .mandatory::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--blue); }

      /* A — uma vitrine editorial de capas. */
      .a-hero { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr); gap:58px; align-items:end; padding:42px; overflow:hidden; border-radius:var(--radius-lg); background:var(--navy); color:white; }
      .a-hero .eyebrow { color:#9bb7ff; }
      .a-hero p { max-width:650px; margin:20px 0 0; color:#c7d0e3; font-size:16px; }
      .a-tools { display:grid; gap:10px; }
      .a-tools .search input,.a-tools .order-select { border-color:rgba(255,255,255,.16); background:rgba(255,255,255,.08); color:white; }
      .a-tools .search input::placeholder { color:#b9c5da; }
      .a-tools .search svg { color:#b9c5da; }
      .a-tool-row { display:grid; grid-template-columns:1fr auto; gap:10px; }
      .a-stats { display:flex; gap:26px; margin-top:30px; }
      .a-stats strong { display:block; font-size:24px; letter-spacing:-.035em; }
      .a-stats span { color:#9eabc2; font-size:11px; }
      .a-catalog-head { display:flex; align-items:end; justify-content:space-between; gap:24px; margin:36px 0 16px; }
      .a-catalog-head p { margin:5px 0 0; color:var(--muted); }
      .cover-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
      .cover-card { position:relative; min-height:208px; display:flex; flex-direction:column; align-items:flex-start; padding:22px; overflow:hidden; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); cursor:pointer; text-align:left; }
      .cover-card::before { content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--accent); }
      .cover-card:hover { transform:translateY(-2px); border-color:var(--line-strong); box-shadow:0 12px 28px rgba(24,24,27,.07); }
      .cover-card.selected { border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
      .cover-index { color:var(--soft); font-size:11px; font-variant-numeric:tabular-nums; }
      .cover-card h3 { max-width:250px; margin-top:34px; font-size:21px; line-height:1.15; letter-spacing:-.025em; }
      .cover-card footer { width:100%; display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:24px; color:var(--muted); font-size:12px; }
      .cover-card footer svg { width:16px; }
      .a-detail { display:grid; grid-template-columns:300px minmax(0,1fr); gap:38px; margin-top:18px; padding:30px; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); }
      .a-detail p { margin:9px 0 22px; color:var(--muted); }
      .a-topics { display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px; }

      /* B — índice tipográfico contínuo, sem grade de cards. */
      .b-layout { display:grid; grid-template-columns:minmax(260px,.58fr) minmax(0,1.42fr); gap:70px; }
      .b-intro { align-self:start; position:sticky; top:26px; }
      .b-intro h1 { font-size:clamp(46px,6vw,78px); }
      .b-intro > p:not(.eyebrow) { max-width:370px; margin:20px 0 28px; color:var(--muted); font-size:15px; }
      .b-tools { display:grid; gap:9px; }
      .b-summary { display:flex; gap:24px; margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
      .b-summary strong { display:block; font-size:18px; }
      .b-summary span { color:var(--muted); font-size:11px; }
      .index-list { border-top:1px solid var(--line-strong); }
      .index-item { border-bottom:1px solid var(--line-strong); }
      .index-trigger { width:100%; display:grid; grid-template-columns:42px minmax(0,1fr) auto 22px; align-items:center; gap:16px; padding:23px 0; border:0; background:transparent; cursor:pointer; text-align:left; }
      .index-trigger:hover h3 { color:var(--blue-dark); }
      .index-number { color:var(--soft); font-size:11px; }
      .index-trigger h3 { font-size:20px; letter-spacing:-.02em; }
      .index-trigger small { color:var(--muted); }
      .index-trigger svg { color:var(--muted); transition:transform .18s ease; }
      .index-item.selected .index-trigger svg { transform:rotate(90deg); }
      .index-detail { display:none; grid-template-columns:42px minmax(0,1fr); gap:16px; padding:0 0 28px; }
      .index-item.selected .index-detail { display:grid; }
      .index-topic-list { display:grid; grid-template-columns:1fr 1fr; gap:0 24px; }
      .index-topic { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
      .index-topic span:first-child { color:var(--ink); }

      /* C — acervo em foco, evolução do master-detail atual. */
      .c-workspace { min-height:710px; display:grid; grid-template-columns:minmax(290px,.72fr) minmax(0,1.28fr); overflow:hidden; border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--paper); }
      .c-master { display:flex; flex-direction:column; padding:28px 18px 18px; background:var(--navy); color:white; }
      .c-master-head { padding:0 10px 20px; }
      .c-master .eyebrow { color:#9bb7ff; }
      .c-master h1 { font-size:42px; }
      .c-master-head p { margin:14px 0 22px; color:#aebbd0; }
      .c-master .search input,.c-master .order-select { border-color:rgba(255,255,255,.14); background:rgba(255,255,255,.08); color:white; }
      .c-master .search input::placeholder { color:#aebbd0; }
      .c-master .search svg { color:#aebbd0; }
      .c-master .order-select { width:100%; margin-top:8px; }
      .c-list { display:flex; flex-direction:column; gap:4px; margin-top:8px; overflow:auto; }
      .c-list button { width:100%; min-height:54px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; padding:9px 12px; border:0; border-radius:9px; background:transparent; color:#c7d0e3; cursor:pointer; text-align:left; }
      .c-list button:hover { background:rgba(255,255,255,.07); color:white; }
      .c-list button.selected { background:white; color:var(--ink); }
      .c-list strong,.c-list span { display:block; }
      .c-list span { margin-top:2px; color:#8fa0ba; font-size:11px; }
      .c-list button.selected span { color:var(--muted); }
      .c-list b { min-width:26px; text-align:right; font-size:12px; }
      .c-detail { display:flex; flex-direction:column; padding:38px 42px; }
      .c-detail-head { display:flex; align-items:flex-start; justify-content:space-between; gap:30px; padding-bottom:28px; border-bottom:1px solid var(--line); }
      .c-detail h2 { max-width:700px; font-size:clamp(32px,4vw,50px); }
      .c-detail-head p { margin:12px 0 0; color:var(--muted); }
      .c-topic-head { display:flex; align-items:end; justify-content:space-between; gap:20px; margin:28px 0 12px; }
      .c-topic-head p { margin:5px 0 0; color:var(--muted); }
      .c-topics { border-top:1px solid var(--line-strong); }
      .c-topic { display:grid; grid-template-columns:38px minmax(0,1fr) auto; align-items:center; gap:16px; min-height:60px; border-bottom:1px solid var(--line); }
      .c-topic-index { color:var(--soft); font-size:11px; }
      .c-topic strong { font-size:13px; }

      .prototype-switcher { position:fixed; z-index:140; left:calc(50% + 116px); bottom:22px; transform:translateX(-50%); display:flex; align-items:center; gap:6px; padding:6px; border:1px solid rgba(255,255,255,.14); border-radius:999px; background:var(--ink); color:white; box-shadow:var(--shadow); }
      .prototype-switcher button { width:34px; height:34px; display:grid; place-items:center; padding:0; border:0; border-radius:50%; background:transparent; color:white; cursor:pointer; }
      .prototype-switcher button:hover { background:rgba(255,255,255,.12); }
      .prototype-switcher span { min-width:188px; padding:0 10px; text-align:center; font-size:12px; font-weight:680; }
      .notice { position:fixed; z-index:150; right:24px; bottom:24px; max-width:320px; padding:13px 16px; border-radius:10px; background:var(--ink); color:white; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); pointer-events:none; transition:.18s ease; }
      .notice.show { opacity:1; transform:none; }

      @media (max-width:1080px) {
        body { padding-left:78px; }
        .sidebar { width:78px; padding:18px 12px; }
        .sidebar .brand { justify-content:center; padding:0; }
        .sidebar .brand > span:last-child,.sidebar-nav span,.sidebar-account > div:last-child { display:none; }
        .sidebar-nav a { justify-content:center; padding:0; }
        .sidebar-account { justify-content:center; padding:14px 0 0; }
        .prototype-switcher { left:calc(50% + 39px); }
        .a-hero { grid-template-columns:1fr; }
        .cover-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
        .b-layout { grid-template-columns:1fr; gap:36px; }
        .b-intro { position:static; }
        .b-tools { grid-template-columns:1fr 220px; }
        .c-workspace { grid-template-columns:300px minmax(0,1fr); }
        .c-detail { padding:32px 28px; }
      }
      @media (max-width:760px) {
        body { padding-left:0; padding-bottom:66px; }
        .container { width:calc(100% - 28px); }
        .sidebar { inset:auto 0 0; width:100%; height:64px; flex-direction:row; align-items:center; padding:8px 12px; border-top:1px solid var(--line); border-right:0; }
        .sidebar .brand,.sidebar-account { display:none; }
        .sidebar-nav { width:100%; flex-direction:row; justify-content:space-around; margin:0; }
        .sidebar-nav a { min-width:120px; justify-content:center; }
        .sidebar-nav span { display:block; }
        .variant { padding-top:22px; }
        .a-hero { gap:34px; padding:28px 22px; }
        .a-tool-row { grid-template-columns:1fr; }
        .cover-grid { grid-template-columns:1fr; }
        .a-detail { grid-template-columns:1fr; gap:12px; }
        .b-tools { grid-template-columns:1fr; }
        .index-trigger { grid-template-columns:30px minmax(0,1fr) auto; }
        .index-trigger small { display:none; }
        .index-trigger svg { display:none; }
        .index-detail { grid-template-columns:30px minmax(0,1fr); }
        .index-topic-list { grid-template-columns:1fr; }
        .c-workspace { grid-template-columns:1fr; }
        .c-master { max-height:530px; }
        .c-detail { padding:28px 20px; }
        .c-detail-head { flex-direction:column; }
        .c-topic-head { align-items:flex-start; flex-direction:column; }
        .prototype-switcher { left:50%; bottom:76px; }
        .notice { right:14px; bottom:136px; }
      }
    </style>
  </head>
  <body>
    <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
      <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.2 8.8-2 4.4-4.4 2 2-4.4 4.4-2Z"/></symbol>
      <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M8 7V5h8v2M3 12h18M10 12v2h4v-2"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5ZM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5Z"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
    </svg>

    <aside class="sidebar" aria-label="Navegação principal">
      <a class="brand" href="#"><span class="brand-mark"><svg><use href="#i-compass"/></svg></span><span>Prumo</span></a>
      <nav class="sidebar-nav">
        <a href="#"><svg><use href="#i-briefcase"/></svg><span>Concursos</span></a>
        <a class="active" href="#" aria-current="page"><svg><use href="#i-book"/></svg><span>Disciplinas</span></a>
      </nav>
      <div class="sidebar-account"><span class="avatar">FR</span><div><strong>Meu espaço</strong><span>Conta pessoal</span></div></div>
    </aside>

    <header class="page-top">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="#">Disciplinas</a><svg><use href="#i-right"/></svg><span aria-current="page">Catálogo</span></nav>
        <div class="page-tabs"><span class="active">Catálogo compartilhado</span></div>
      </div>
    </header>

    <main id="variant-host"></main>

    <div class="prototype-switcher" aria-label="Alternar variante">
      <button id="previous-variant" aria-label="Variante anterior"><svg><use href="#i-left"/></svg></button>
      <span id="variant-label"></span>
      <button id="next-variant" aria-label="Próxima variante"><svg><use href="#i-right"/></svg></button>
    </div>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>

    <script>
      const disciplines=[
        {id:'tributario',name:'Direito Tributário',count:22,accent:'#315fcb',topics:['Sistema Tributário Nacional','Limitações ao poder de tributar','Obrigação tributária','Crédito tributário','Administração tributária']},
        {id:'portugues',name:'Língua Portuguesa',count:16,accent:'#9a5b3d',topics:['Interpretação de textos','Coesão e coerência','Morfossintaxe','Pontuação','Redação oficial']},
        {id:'contabilidade',name:'Contabilidade Geral',count:20,accent:'#39715c',topics:['Patrimônio e equação patrimonial','Escrituração contábil','Demonstrações contábeis','Estoques','Análise das demonstrações']},
        {id:'constitucional',name:'Direito Constitucional',count:18,accent:'#7552a6',topics:['Princípios fundamentais','Direitos e garantias fundamentais','Organização do Estado','Poder Legislativo','Controle de constitucionalidade']},
        {id:'administrativo',name:'Direito Administrativo',count:14,accent:'#b07822',topics:['Princípios administrativos','Atos administrativos','Poderes da Administração','Licitações e contratos','Agentes públicos']},
        {id:'logico',name:'Raciocínio Lógico',count:12,accent:'#b24a5a',topics:['Estruturas lógicas','Equivalências','Lógica de argumentação','Conjuntos','Análise combinatória']},
        {id:'ti',name:'Tecnologia da Informação',count:24,accent:'#287e91',topics:['Governança de TI','Banco de dados','Redes de computadores','Segurança da informação','Desenvolvimento de sistemas']},
        {id:'auditoria',name:'Auditoria',count:11,accent:'#63713a',topics:['Normas de auditoria','Planejamento','Risco de auditoria','Evidências','Relatório do auditor']},
        {id:'estatistica',name:'Estatística',count:10,accent:'#835b74',topics:['Estatística descritiva','Probabilidade','Variáveis aleatórias','Distribuições','Inferência estatística']},
        {id:'economia',name:'Economia',count:15,accent:'#936c34',topics:['Microeconomia','Macroeconomia','Política monetária','Política fiscal','Economia brasileira']},
        {id:'financas',name:'Finanças Públicas',count:12,accent:'#426d84',topics:['Orçamento público','Receita pública','Despesa pública','Crédito público','Responsabilidade fiscal']},
        {id:'administracao',name:'Administração Pública',count:13,accent:'#6e5c50',topics:['Modelos de Administração Pública','Governança pública','Gestão por processos','Planejamento estratégico','Gestão de pessoas']}
      ];
      const variants=['A','B','C'];
      const names={A:'Vitrine editorial',B:'Índice vivo',C:'Acervo em foco'};
      let currentVariant=variants.includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A';
      let selectedId='tributario';
      let query='';
      let order='catalog';
      let noticeTimer;

      const icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`;
      const visibleDisciplines=()=>{
        const filtered=disciplines.filter(item=>item.name.toLocaleLowerCase('pt-BR').includes(query.toLocaleLowerCase('pt-BR')));
        return order==='alphabetical'?[...filtered].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')):filtered;
      };
      const selected=()=>disciplines.find(item=>item.id===selectedId)||visibleDisciplines()[0]||disciplines[0];
      const totalTopics=()=>disciplines.reduce((total,item)=>total+item.count,0);
      const searchField=className=>`<label class="search ${className||''}">${icon('i-search')}<input data-search type="search" value="${query}" placeholder="Buscar Disciplina" aria-label="Buscar Disciplina" /></label>`;
      const orderField=()=>`<select class="order-select" data-order aria-label="Ordenar Disciplinas"><option value="catalog" ${order==='catalog'?'selected':''}>Ordem do catálogo</option><option value="alphabetical" ${order==='alphabetical'?'selected':''}>Ordem alfabética</option></select>`;
      const topicPills=item=>[...item.topics,'Revisão de Véspera'].map((topic,index)=>`<span class="topic-pill">${topic}${index===item.topics.length?' · obrigatório':''}</span>`).join('');
      const stateCopy=items=>`${items.length} de ${disciplines.length} Disciplinas`;

      function variantA(items,item){return `<section class="variant"><div class="container"><header class="a-hero"><div><p class="eyebrow">Catálogo compartilhado</p><h1>Conhecimento que atravessa Editais.</h1><p>Cada Disciplina reúne Tópicos mantidos uma única vez e reutilizados em diferentes Concursos.</p><div class="a-stats"><div><strong>${disciplines.length}</strong><span>Disciplinas</span></div><div><strong>${totalTopics()}</strong><span>Tópicos</span></div></div></div><div class="a-tools">${searchField()}<div class="a-tool-row">${orderField()}<button class="button light" data-new>${icon('i-plus')}Nova Disciplina</button></div></div></header><div class="a-catalog-head"><div><h2>Explore o catálogo</h2><p>Selecione uma Disciplina para consultar seus Tópicos.</p></div><span class="result-state">${stateCopy(items)}</span></div><div class="cover-grid">${items.map((discipline,index)=>`<button class="cover-card ${discipline.id===item.id?'selected':''}" data-select="${discipline.id}" style="--accent:${discipline.accent}"><span class="cover-index">${String(index+1).padStart(2,'0')}</span><h3>${discipline.name}</h3><footer><span>${discipline.count} Tópicos</span>${icon('i-right')}</footer></button>`).join('')}</div>${items.length?`<section class="a-detail"><div><p class="eyebrow">Disciplina selecionada</p><h2>${item.name}</h2><p>${item.count} Tópicos no catálogo compartilhado.</p><button class="button" data-topic>${icon('i-plus')}Adicionar Tópico</button></div><div class="a-topics">${topicPills(item)}</div></section>`:''}</div></section>`;}

      function variantB(items,item){return `<section class="variant"><div class="container b-layout"><aside class="b-intro"><p class="eyebrow">Índice de conhecimento</p><h1>Disciplinas.</h1><p>Um catálogo contínuo para localizar, comparar e manter os Tópicos compartilhados.</p><div class="b-tools">${searchField()}${orderField()}<button class="button primary" data-new>${icon('i-plus')}Nova Disciplina</button></div><div class="b-summary"><div><strong>${items.length}</strong><span>visíveis</span></div><div><strong>${totalTopics()}</strong><span>Tópicos no total</span></div></div></aside><div><div class="index-list">${items.map((discipline,index)=>`<article class="index-item ${discipline.id===item.id?'selected':''}"><button class="index-trigger" data-select="${discipline.id}"><span class="index-number">${String(index+1).padStart(2,'0')}</span><h3>${discipline.name}</h3><small>${discipline.count} Tópicos</small>${icon('i-right')}</button><div class="index-detail"><span></span><div><div class="index-topic-list">${[...discipline.topics,'Revisão de Véspera'].map((topic,topicIndex)=>`<div class="index-topic"><span>${topic}</span>${topicIndex===discipline.topics.length?'<span class="mandatory">Obrigatório</span>':''}</div>`).join('')}</div><button class="button" data-topic style="margin-top:18px">${icon('i-plus')}Adicionar Tópico</button></div></div></article>`).join('')}</div><p class="result-state" style="margin-top:14px">${stateCopy(items)}</p></div></div></section>`;}

      function variantC(items,item){return `<section class="variant"><div class="container"><div class="c-workspace"><aside class="c-master"><div class="c-master-head"><p class="eyebrow">Catálogo compartilhado</p><h1>Disciplinas</h1><p>Escolha uma Disciplina para navegar pelos Tópicos.</p>${searchField()}${orderField()}</div><div class="c-list">${items.map(discipline=>`<button class="${discipline.id===item.id?'selected':''}" data-select="${discipline.id}"><div><strong>${discipline.name}</strong><span>${discipline.count} Tópicos</span></div><b>${String(discipline.count).padStart(2,'0')}</b></button>`).join('')}</div></aside><section class="c-detail"><header class="c-detail-head"><div><p class="eyebrow">Disciplina selecionada</p><h2>${item.name}</h2><p>Catálogo compartilhado · ${item.count} Tópicos</p></div><button class="icon-button" aria-label="Mais ações para ${item.name}" data-more>${icon('i-more')}</button></header><div class="c-topic-head"><div><h3>Tópicos</h3><p>Conteúdo disponível para composição dos Editais.</p></div><button class="button primary" data-topic>${icon('i-plus')}Adicionar Tópico</button></div><div class="c-topics">${[...item.topics,'Revisão de Véspera'].map((topic,index)=>`<div class="c-topic"><span class="c-topic-index">${String(index+1).padStart(2,'0')}</span><strong>${topic}</strong>${index===item.topics.length?'<span class="mandatory">Obrigatório</span>':`<button class="icon-button" aria-label="Mais ações para ${topic}" data-more>${icon('i-more')}</button>`}</div>`).join('')}</div></section></div></div></section>`;}

      function render(){
        const items=visibleDisciplines();
        if(items.length&&!items.some(item=>item.id===selectedId))selectedId=items[0].id;
        const item=selected();
        document.getElementById('variant-host').innerHTML=currentVariant==='A'?variantA(items,item):currentVariant==='B'?variantB(items,item):variantC(items,item);
        document.getElementById('variant-label').textContent=`${currentVariant} — ${names[currentVariant]}`;
        const url=new URL(location.href);url.searchParams.set('variant',currentVariant);history.replaceState({},'',url);
        bindContent();
      }
      function bindContent(){
        document.querySelectorAll('[data-select]').forEach(button=>button.addEventListener('click',()=>{selectedId=button.dataset.select;render();}));
        document.querySelectorAll('[data-search]').forEach(input=>input.addEventListener('input',()=>{query=input.value;render();const next=document.querySelector('[data-search]');next.focus();next.setSelectionRange(next.value.length,next.value.length);}));
        document.querySelectorAll('[data-order]').forEach(select=>select.addEventListener('change',()=>{order=select.value;render();}));
        document.querySelectorAll('[data-new]').forEach(button=>button.addEventListener('click',()=>showNotice('A criação abrirá um drawer na implementação final.')));
        document.querySelectorAll('[data-topic]').forEach(button=>button.addEventListener('click',()=>showNotice(`Adicionar Tópico em ${selected().name}.`)));
        document.querySelectorAll('[data-more]').forEach(button=>button.addEventListener('click',()=>showNotice('Ações de renomear e excluir.')));
      }
      function cycleVariant(direction){const index=variants.indexOf(currentVariant);currentVariant=variants[(index+direction+variants.length)%variants.length];render();}
      function showNotice(message){const notice=document.getElementById('notice');notice.textContent=message;notice.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),2200);}
      document.getElementById('previous-variant').addEventListener('click',()=>cycleVariant(-1));
      document.getElementById('next-variant').addEventListener('click',()=>cycleVariant(1));
      document.addEventListener('keydown',event=>{if(event.target.matches('input,textarea,select,[contenteditable="true"]'))return;if(event.key==='ArrowLeft')cycleVariant(-1);if(event.key==='ArrowRight')cycleVariant(1);});
      render();
    </script>
  </body>
</html>
