<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disciplinas · Protótipo minimalista</title>
<!-- PROTÓTIPO DESCARTÁVEL: catálogo minimalista de Disciplinas e Tópicos. -->
<style>
:root{--i:#18181b;--m:#71717a;--l:#e4e4e7;--w:#f4f4f5;--p:#fff;--c:#f8f8f7}*{box-sizing:border-box}body{margin:0;padding-left:68px;background:var(--c);color:var(--i);font:14px/1.5 Geist,Inter,system-ui,sans-serif}button,input,select{font:inherit}button{color:inherit}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.side{position:fixed;inset:0 auto 0 0;width:68px;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--l);background:#fff}.brand{width:100%;height:64px;display:grid;place-items:center;border-bottom:1px solid var(--l)}.logo{width:32px;height:32px;display:grid;place-items:center}.logo svg{width:32px;height:32px}.nav{display:grid;gap:4px;margin-top:12px}.railbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--m)}.railbtn.on{background:var(--w);color:var(--i)}.settings{margin-top:auto;margin-bottom:12px;padding-top:12px;border-top:1px solid var(--l)}.top{height:64px;display:flex;align-items:center;border-bottom:1px solid var(--l);background:#fff}.topinner{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.wrap{width:calc(100% - 64px);max-width:none;margin:auto}.crumb{min-height:32px;display:flex;align-items:center;color:var(--i);font-size:12px}.theme{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--m)}.theme:hover{background:var(--w)}.page{padding:30px 0 110px}.head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px}.head h1{margin:0 0 5px;font-size:30px;letter-spacing:-.04em}.head p{margin:0;color:var(--m)}.actions{display:flex;gap:8px}.btn{height:40px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid #d4d4d8;border-radius:8px;background:#fff;font-weight:650;cursor:pointer}.btn.black{background:var(--i);color:#fff;border-color:var(--i)}.search{position:relative;width:270px}.search svg{position:absolute;left:12px;top:11px;color:var(--m)}.search input{width:100%;height:40px;padding:0 12px 0 38px;border:1px solid #d4d4d8;border-radius:8px;background:#fff}.sort{height:36px;border:1px solid var(--l);border-radius:8px;background:#fff;color:var(--m);font-size:12px}.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--m);font-size:12px}.box{border:1px solid var(--l);border-radius:12px;background:#fff;overflow:hidden}
/* A */.split{display:grid;grid-template-columns:310px 1fr;min-height:620px}.master{padding:12px;border-right:1px solid var(--l)}.list{display:grid;gap:3px}.item{width:100%;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer}.item:hover{background:var(--w)}.item.on{background:var(--i);color:#fff}.book{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--l);border-radius:8px;background:#fff;color:var(--m)}.item strong{display:block}.item small,.item>b{display:none}.detail{padding:28px}.detailtop{display:flex;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--l)}h2,h3{margin-top:0}.detail h2{margin-bottom:4px}.muted{color:var(--m)}.topicshead{display:flex;justify-content:space-between;align-items:end;margin:22px 0 8px}.topics{border-top:1px solid var(--l)}.topic{display:grid;grid-template-columns:30px 1fr auto;align-items:center;min-height:56px;border-bottom:1px solid var(--l)}.num{color:#a1a1aa;font-size:11px}.required{color:var(--m);font-size:11px}
/* B */.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{min-height:122px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--l);border-radius:12px;background:#fff;text-align:left;cursor:pointer}.card:hover{border-color:#a1a1aa}.card.on{border-color:var(--i);box-shadow:inset 0 0 0 1px var(--i)}.cardtop{width:100%;display:flex;justify-content:space-between;color:var(--m)}.card h3{margin:18px 0 0}.card small{margin-top:auto;color:var(--m)}.below{display:grid;grid-template-columns:240px 1fr;gap:28px;margin-top:12px;padding:22px}.chips{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}.chip{padding:7px 10px;border:1px solid var(--l);border-radius:8px;background:var(--c);font-size:12px}
/* C */.rows article{border-bottom:1px solid var(--l)}.rows article:last-child{border:0}.trigger{width:100%;min-height:62px;display:grid;grid-template-columns:34px 1fr auto 20px;align-items:center;gap:14px;padding:0 18px;border:0;background:#fff;text-align:left;cursor:pointer}.trigger:hover,.rows article.on .trigger{background:var(--w)}.trigger h3{margin:0;font-size:14px}.trigger small{color:var(--m)}.expanded{display:none;padding:0 18px 18px 66px;background:var(--w)}.rows article.on .expanded{display:block}.gridtopics{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.gridtopic{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--l);font-size:12px}
.paneltools{display:grid;gap:8px;padding:2px 2px 12px}.paneltools .search,.topictools .search{width:100%}.toolline,.topictools,.titleactions{display:flex;align-items:center;gap:7px}.sort{display:none}.mini{height:34px;padding:0 10px;border:1px solid var(--l);border-radius:7px;background:#fff;color:var(--m);font-size:11px;font-weight:650;cursor:pointer}.mini.danger{color:#b42318}.actionicon{width:36px;height:36px;display:grid;place-items:center;padding:0;border:1px solid var(--l);border-radius:8px;background:#fff;color:var(--m);cursor:pointer}.actionicon:hover{background:var(--w);color:var(--i)}.actionicon.add{border-color:var(--i);background:var(--i);color:#fff}.actionicon.danger:hover{border-color:#fda29b;background:#fff;color:#b42318}.actionicon svg{width:16px}.topic .rowactions{display:flex;gap:4px}.topic .rowactions .actionicon{width:32px;height:32px;border-color:transparent;background:transparent}.newdiscipline{width:100%;justify-content:center;margin-bottom:12px;border-color:#d4d4d8;background:var(--w);color:var(--i)}.newdiscipline:hover{background:#e4e4e7}.detailtop + .topics{margin-top:18px}@media(max-width:900px){.split{grid-template-columns:290px 1fr}}@media(max-width:650px){body{padding-left:0;padding-bottom:64px}.side{inset:auto 0 0;width:100%;height:64px;z-index:10;flex-direction:row;justify-content:center;border-top:1px solid var(--l);border-right:0}.brand,.settings{display:none}.nav{display:flex;margin:0;gap:48px}.railbtn{width:56px}.wrap{width:calc(100% - 28px)}.head{align-items:stretch;flex-direction:column}.actions,.titleactions{flex-wrap:wrap}.search{flex:1}.split{grid-template-columns:1fr}.master{border-right:0;border-bottom:1px solid var(--l)}}
</style></head><body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0"><symbol id="book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h5v16H6a2 2 0 0 0-2 2Zm16 0a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2Z"/></symbol><symbol id="case" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M8 7V5h8v2M3 12h18"/></symbol><symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H3v-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V3h4v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></symbol><symbol id="moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol><symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol><symbol id="right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol><symbol id="left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol></svg>
<aside class="side" aria-label="Navegação principal"><div class="brand" aria-label="Prumo.app"><span class="logo"><svg viewBox="0 0 128 128"><rect width="128" height="128" rx="24" fill="#18181b" stroke="none"/><path d="M64 22v54M43 34h42M48 50h32M53 66h22M37 102h54" stroke="#fafafa" stroke-width="7"/><path d="M64 76 80 94H48Z" fill="#fafafa" stroke="none"/></svg></span></div><nav class="nav"><div class="railbtn" title="Concursos"><svg><use href="#case"/></svg></div><div class="railbtn on" title="Disciplinas"><svg><use href="#book"/></svg></div></nav><div class="settings"><div class="railbtn" title="Administração"><svg><use href="#settings"/></svg></div></div></aside><header class="top"><div class="topinner"><div class="crumb">Disciplinas</div><button class="theme" aria-label="Usar tema escuro"><svg><use href="#moon"/></svg></button></div></header><main id="host"></main>
<script>
const ds=[['Direito Tributário',22],['Língua Portuguesa',16],['Contabilidade Geral',20],['Direito Constitucional',18],['Direito Administrativo',14],['Raciocínio Lógico',12],['Tecnologia da Informação',24],['Auditoria',11],['Estatística',10],['Economia',15],['Finanças Públicas',12],['Administração Pública',13]].map((x,i)=>({id:i,name:x[0],count:x[1]}));
const ts=['Princípios e conceitos fundamentais','Organização e competências','Normas e aplicação','Procedimentos','Controle e responsabilidade','Revisão de Véspera'];
let sel=0,q='';
const icon=x=>`<svg><use href="#${x}"/></svg>`;
const matches=(value)=>value.toLowerCase().includes(q.toLowerCase());
const items=()=>!q?ds:ds.filter(d=>matches(d.name)||ts.some(matches));
const topicItems=()=>!q?ts:ts.filter(matches);
const search=()=>`<label class="search">${icon('search')}<input data-search value="${q}" placeholder="Buscar Disciplinas e Tópicos"></label>`;
const head=()=>`<header class="head"><div><h1>Disciplinas</h1><p>Catálogo de Disciplinas e Tópicos compartilhado entre Concursos.</p></div><div class="actions">${search()}</div></header>`;
const list=a=>a.map(x=>`<button class="item ${x.id===sel?'on':''}" data-id="${x.id}"><span class="book">${icon('book')}</span><span><strong>${x.name}</strong></span></button>`).join('');
const topicRows=()=>topicItems().map((t,i)=>`<div class="topic"><span class="num">${String(i+1).padStart(2,'0')}</span><strong>${t}</strong>${t==='Revisão de Véspera'?'<span class="required">Obrigatório</span>':`<span class="rowactions"><button class="actionicon" data-action aria-label="Editar ${t}" title="Editar">${icon('edit')}</button><button class="actionicon danger" data-action aria-label="Excluir ${t}" title="Excluir">${icon('trash')}</button></span>`}</div>`).join('');
function screen(a,d){return `<section class="page"><div class="wrap">${head()}<div class="box split"><aside class="master"><button class="btn newdiscipline" data-action>${icon('plus')}Nova Disciplina</button><div class="list">${list(a)}</div></aside><section class="detail"><div class="detailtop"><div><h2>${d.name}</h2><span class="muted">${d.count} Tópicos no catálogo.</span></div><div class="titleactions"><button class="actionicon add" data-action aria-label="Adicionar Tópico" title="Adicionar Tópico">${icon('plus')}</button><button class="actionicon" data-action aria-label="Editar Disciplina" title="Editar Disciplina">${icon('edit')}</button><button class="actionicon danger" data-action aria-label="Excluir Disciplina" title="Excluir Disciplina">${icon('trash')}</button></div></div><div class="topics">${topicRows()}</div></section></div></div></section>`}
function render(){const a=items();if(a.length&&!a.some(x=>x.id===sel))sel=a[0].id;const d=ds.find(x=>x.id===sel)||a[0]||ds[0];host.innerHTML=screen(a,d);const u=new URL(location);u.searchParams.delete('variant');history.replaceState({},'',u);document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{sel=+b.dataset.id;render()});document.querySelector('[data-search]').oninput=e=>{q=e.target.value;render();const n=document.querySelector('[data-search]');n.focus();n.setSelectionRange(n.value.length,n.value.length)};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{})}
render();
</script></body></html>
