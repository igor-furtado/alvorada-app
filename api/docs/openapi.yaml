openapi: 3.1.0
info:
  title: Prumo API
  version: 1.0.0
  description: API para organização de Concursos, disciplinas e tópicos de estudo.
  contact:
    name: Prumo.app
servers:
  - url: /
    description: Mesmo endereço que serve a documentação
security: []
tags:
  - name: Saúde
    description: Disponibilidade do serviço
  - name: Disciplinas
    description: Organização das disciplinas
  - name: Concursos
    description: Concursos que orientam o Plano
  - name: Tópicos
    description: Conteúdo pertencente a uma disciplina
paths:
  /health:
    get:
      tags: [Saúde]
      summary: Verifica a disponibilidade da API
      operationId: obterSaude
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saude'
  /api/v1/concursos:
    get:
      tags: [Concursos]
      summary: Lista os Concursos ativos em ordem de prova
      operationId: listarConcursos
      responses:
        '200':
          description: Concursos ativos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Concurso'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Concursos]
      summary: Cria um Concurso
      operationId: criarConcurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarConcurso'
      responses:
        '201':
          description: Concurso criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoCriado'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/concursos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    put:
      tags: [Concursos]
      summary: Atualiza um Concurso
      description: Atualiza os dados do Concurso sem alterar o progresso do Edital.
      operationId: atualizarConcurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarConcurso'
      responses:
        '204':
          description: Concurso atualizado
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Concursos]
      summary: Exclui definitivamente um Concurso
      operationId: excluirConcurso
      responses:
        '204':
          description: Concurso excluído
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/concursos/{id}/prioridade:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    put:
      tags: [Concursos]
      summary: Define o Concurso prioritário
      description: Remove a prioridade do Concurso anterior e a atribui ao Concurso informado.
      operationId: definirConcursoPrioritario
      responses:
        '204':
          description: Prioridade atualizada
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/concursos/{id}/arquivamento:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    put:
      tags: [Concursos]
      summary: Arquiva um Concurso
      operationId: arquivarConcurso
      responses:
        '204':
          description: Concurso arquivado
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Concursos]
      summary: Restaura um Concurso arquivado
      operationId: restaurarConcurso
      responses:
        '204':
          description: Concurso restaurado
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/concursos/{id}/edital/disciplinas/{disciplinaId}:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
      - name: disciplinaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Concursos]
      summary: Vincula ao Edital todos os Tópicos comuns atuais de uma Disciplina
      operationId: adicionarDisciplinaAoEdital
      responses:
        '204':
          description: Tópicos ausentes vinculados
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/concursos/{id}/edital/topicos/{topicoId}:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
      - name: topicoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Concursos]
      summary: Vincula um Tópico ao Edital
      operationId: adicionarTopicoAoEdital
      responses:
        '204':
          description: Tópico vinculado
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Concursos]
      summary: Remove o vínculo de um Tópico com o Edital
      operationId: removerTopicoDoEdital
      responses:
        '204':
          description: Vínculo removido
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/subjects:
    get:
      tags: [Disciplinas]
      summary: Lista o catálogo completo de estudos
      description: Retorna disciplinas com seus tópicos aninhados.
      operationId: listarDisciplinas
      responses:
        '200':
          description: Catálogo atual
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disciplina'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Disciplinas]
      summary: Cria uma disciplina
      description: Cria a Disciplina com o Tópico obrigatório Revisão de Véspera na última posição.
      operationId: criarDisciplina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarDisciplina'
      responses:
        '201':
          description: Disciplina criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoCriado'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/subjects/{id}:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    patch:
      tags: [Disciplinas]
      summary: Atualiza uma disciplina
      operationId: atualizarDisciplina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarDisciplina'
      responses:
        '204':
          description: Disciplina atualizada
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Disciplinas]
      summary: Exclui uma disciplina
      description: Os Tópicos relacionados também são excluídos quando nenhum deles estiver vinculado a um Edital.
      operationId: excluirDisciplina
      responses:
        '204':
          description: Disciplina excluída
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/subjects/{id}/topics:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    post:
      tags: [Tópicos]
      summary: Adiciona um tópico a uma disciplina
      operationId: criarTopico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaNome'
      responses:
        '201':
          description: Tópico criado
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/subjects/{id}/topics/batch:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    post:
      tags: [Tópicos]
      summary: Adiciona vários tópicos a uma disciplina
      description: Valida e cria todos os Tópicos em uma única operação, preservando a ordem informada.
      operationId: criarTopicos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaNomes'
      responses:
        '201':
          description: Tópicos criados
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/topics/{id}:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    patch:
      tags: [Tópicos]
      summary: Renomeia um tópico
      operationId: atualizarTopico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaNome'
      responses:
        '204':
          description: Tópico atualizado
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Tópicos]
      summary: Exclui um tópico
      description: A exclusão é bloqueada enquanto o Tópico estiver vinculado a um Edital.
      operationId: excluirTopico
      responses:
        '204':
          description: Tópico excluído
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
components:
  parameters:
    IdRecurso:
      name: id
      in: path
      required: true
      description: Identificador UUID do recurso
      schema:
        type: string
        format: uuid
  responses:
    ErroValidacao:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroInterno:
      description: Erro interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    RecursoNaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Saude:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    RecursoCriado:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    Concurso:
      type: object
      required: [id, instituicao, cargo, banca, data_prova, prioritario, progresso_edital, sigla, quantidade_vagas, vencimento_centavos, carga_horaria_semanal, local_prova, horario_inicio_prova, horario_fim_prova, requisitos, criterios_pontuacao, disciplinas]
      properties:
        id:
          type: string
          format: uuid
        instituicao:
          type: string
          minLength: 1
          maxLength: 160
        cargo:
          type: string
          minLength: 1
          maxLength: 160
        banca:
          type: [string, 'null']
          maxLength: 120
        data_prova:
          type: [string, 'null']
          format: date
        prioritario:
          type: boolean
        progresso_edital:
          type: integer
          minimum: 0
          maximum: 100
        sigla:
          type: [string, 'null']
          maxLength: 24
        quantidade_vagas:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000000
        vencimento_centavos:
          type: [integer, 'null']
          format: int64
          minimum: 0
        carga_horaria_semanal:
          type: [integer, 'null']
          minimum: 1
          maximum: 168
        local_prova:
          type: [string, 'null']
          maxLength: 240
        horario_inicio_prova:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        horario_fim_prova:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        requisitos:
          type: [string, 'null']
          maxLength: 10000
        criterios_pontuacao:
          type: [string, 'null']
          maxLength: 10000
        disciplinas:
          type: array
          description: Disciplinas derivadas dos Tópicos vinculados ao Edital.
          items:
            $ref: '#/components/schemas/DisciplinaEdital'
    DisciplinaEdital:
      type: object
      required: [id, nome, topicos]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        topicos:
          type: array
          items:
            $ref: '#/components/schemas/TopicoEdital'
    TopicoEdital:
      type: object
      required: [id, nome, obrigatorio]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        obrigatorio:
          type: boolean
    CriarConcurso:
      type: object
      required: [instituicao, cargo]
      properties:
        instituicao:
          type: string
          minLength: 1
          maxLength: 160
          examples: [Tribunal Regional Federal da 5ª Região]
        cargo:
          type: string
          minLength: 1
          maxLength: 160
          examples: [Técnico Judiciário — Área Administrativa]
        banca:
          type: [string, 'null']
          maxLength: 120
          examples: [FCC]
        data_prova:
          type: [string, 'null']
          format: date
        prioritario:
          type: boolean
          default: false
        sigla:
          type: [string, 'null']
          maxLength: 24
        quantidade_vagas:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000000
        vencimento_centavos:
          type: [integer, 'null']
          format: int64
          minimum: 0
        carga_horaria_semanal:
          type: [integer, 'null']
          minimum: 1
          maximum: 168
        local_prova:
          type: [string, 'null']
          maxLength: 240
        horario_inicio_prova:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        horario_fim_prova:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        requisitos:
          type: [string, 'null']
          maxLength: 10000
        criterios_pontuacao:
          type: [string, 'null']
          maxLength: 10000
    AtualizarConcurso:
      type: object
      required: [instituicao, cargo, prioritario]
      properties:
        instituicao:
          type: string
          minLength: 1
          maxLength: 160
        cargo:
          type: string
          minLength: 1
          maxLength: 160
        banca:
          type: [string, 'null']
          maxLength: 120
        data_prova:
          type: [string, 'null']
          format: date
        prioritario:
          type: boolean
        sigla:
          type: [string, 'null']
          maxLength: 24
        quantidade_vagas:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000000
        vencimento_centavos:
          type: [integer, 'null']
          format: int64
          minimum: 0
        carga_horaria_semanal:
          type: [integer, 'null']
          minimum: 1
          maximum: 168
        local_prova:
          type: [string, 'null']
          maxLength: 240
        horario_inicio_prova:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        horario_fim_prova:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        requisitos:
          type: [string, 'null']
          maxLength: 10000
        criterios_pontuacao:
          type: [string, 'null']
          maxLength: 10000
    CriarDisciplina:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
          examples: [Direito Constitucional]
        dificuldade:
          $ref: '#/components/schemas/Dificuldade'
        cor:
          $ref: '#/components/schemas/Cor'
    AtualizarDisciplina:
      type: object
      minProperties: 1
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
        dificuldade:
          $ref: '#/components/schemas/Dificuldade'
        cor:
          $ref: '#/components/schemas/Cor'
    EntradaNome:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
          examples: [Controle de constitucionalidade]
    EntradaNomes:
      type: object
      required: [nomes]
      properties:
        nomes:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 120
          examples:
            - [Controle de constitucionalidade, Direitos fundamentais]
    Dificuldade:
      type: integer
      minimum: 1
      maximum: 5
      default: 3
      description: 1 representa muito fácil e 5 representa muito difícil.
    Cor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      default: '#E8742A'
      examples: ['#3178C6']
    Disciplina:
      type: object
      required: [id, nome, dificuldade, cor, topicos]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        dificuldade:
          $ref: '#/components/schemas/Dificuldade'
        cor:
          $ref: '#/components/schemas/Cor'
        topicos:
          type: array
          items:
            $ref: '#/components/schemas/Topico'
    Topico:
      type: object
      required: [id, nome, obrigatorio]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        obrigatorio:
          type: boolean
          description: Indica o Tópico estrutural Revisão de Véspera, que não pode ser alterado nem excluído.
    Erro:
      type: object
      required: [erro]
      properties:
        erro:
          type: string
