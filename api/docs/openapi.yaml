openapi: 3.1.0
info:
  title: Prumo API
  version: 1.0.0
  description: API para organização de disciplinas, tópicos e subtópicos de estudo.
  contact:
    name: Prumo.app
servers:
  - url: /
    description: Mesmo endereço que serve a documentação
security: []
tags:
  - name: Saúde
    description: Disponibilidade do serviço
  - name: Disciplinas
    description: Organização das disciplinas
  - name: Tópicos
    description: Conteúdo pertencente a uma disciplina
  - name: Subtópicos
    description: Detalhamento de um tópico
paths:
  /health:
    get:
      tags: [Saúde]
      summary: Verifica a disponibilidade da API
      operationId: obterSaude
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saude'
  /api/v1/subjects:
    get:
      tags: [Disciplinas]
      summary: Lista o catálogo completo de estudos
      description: Retorna disciplinas com seus tópicos e subtópicos aninhados.
      operationId: listarDisciplinas
      responses:
        '200':
          description: Catálogo atual
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disciplina'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Disciplinas]
      summary: Cria uma disciplina
      description: Cria a Disciplina com o Tópico obrigatório Revisão de Véspera na última posição.
      operationId: criarDisciplina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarDisciplina'
      responses:
        '201':
          description: Disciplina criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecursoCriado'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/subjects/{id}:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    patch:
      tags: [Disciplinas]
      summary: Atualiza uma disciplina
      operationId: atualizarDisciplina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarDisciplina'
      responses:
        '204':
          description: Disciplina atualizada
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Disciplinas]
      summary: Exclui uma disciplina
      description: Os tópicos e subtópicos relacionados também são excluídos.
      operationId: excluirDisciplina
      responses:
        '204':
          description: Disciplina excluída
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/subjects/{id}/topics:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    post:
      tags: [Tópicos]
      summary: Adiciona um tópico a uma disciplina
      operationId: criarTopico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaNome'
      responses:
        '201':
          description: Tópico criado
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/topics/{id}:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    patch:
      tags: [Tópicos]
      summary: Renomeia um tópico
      operationId: atualizarTopico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaNome'
      responses:
        '204':
          description: Tópico atualizado
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Tópicos]
      summary: Exclui um tópico
      description: Seus subtópicos também são excluídos.
      operationId: excluirTopico
      responses:
        '204':
          description: Tópico excluído
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/topics/{id}/subtopics:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    post:
      tags: [Subtópicos]
      summary: Adiciona um subtópico a um tópico
      operationId: criarSubtopico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaNome'
      responses:
        '201':
          description: Subtópico criado
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /api/v1/subtopics/{id}:
    parameters:
      - $ref: '#/components/parameters/IdRecurso'
    patch:
      tags: [Subtópicos]
      summary: Renomeia um subtópico
      operationId: atualizarSubtopico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaNome'
      responses:
        '204':
          description: Subtópico atualizado
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Subtópicos]
      summary: Exclui um subtópico
      operationId: excluirSubtopico
      responses:
        '204':
          description: Subtópico excluído
        '500':
          $ref: '#/components/responses/ErroInterno'
components:
  parameters:
    IdRecurso:
      name: id
      in: path
      required: true
      description: Identificador UUID do recurso
      schema:
        type: string
        format: uuid
  responses:
    ErroValidacao:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroInterno:
      description: Erro interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Saude:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    RecursoCriado:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    CriarDisciplina:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
          examples: [Direito Constitucional]
        dificuldade:
          $ref: '#/components/schemas/Dificuldade'
        cor:
          $ref: '#/components/schemas/Cor'
    AtualizarDisciplina:
      type: object
      minProperties: 1
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
        dificuldade:
          $ref: '#/components/schemas/Dificuldade'
        cor:
          $ref: '#/components/schemas/Cor'
    EntradaNome:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 120
          examples: [Controle de constitucionalidade]
    Dificuldade:
      type: integer
      minimum: 1
      maximum: 5
      default: 3
      description: 1 representa muito fácil e 5 representa muito difícil.
    Cor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      default: '#E8742A'
      examples: ['#3178C6']
    Disciplina:
      type: object
      required: [id, nome, dificuldade, cor, topicos]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        dificuldade:
          $ref: '#/components/schemas/Dificuldade'
        cor:
          $ref: '#/components/schemas/Cor'
        topicos:
          type: array
          items:
            $ref: '#/components/schemas/Topico'
    Topico:
      type: object
      required: [id, nome, obrigatorio, subtopicos]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        obrigatorio:
          type: boolean
          description: Indica o Tópico estrutural Revisão de Véspera, que não pode ser alterado nem excluído.
        subtopicos:
          type: array
          items:
            $ref: '#/components/schemas/Subtopico'
    Subtopico:
      type: object
      required: [id, nome]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
    Erro:
      type: object
      required: [erro]
      properties:
        erro:
          type: string
